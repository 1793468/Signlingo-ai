# speech-to-text/configs/config.yaml

# Confirmed against notebooks/egyptian-stt-baseline-30k-clean.ipynb (the
# actual Kaggle training run) — this is what was really used, not a guess.

dataset:
  kaggle_handle: "fadisarwat/egyptian-arabic-lines"
  raw_dir: "speech-to-text/data/raw"
  manifest_dir: "speech-to-text/data/manifests"
  index_file: "index.csv"      # confirmed: dataset ships index.csv + a data/ audio folder
  audio_subdir: "data"
  text_col: "text"
  audio_col: "audio_file"
  sample_rate: 16000
  max_samples: 30000            # notebook trains on a 30k stratified subsample, not the full 400k
  min_duration_sec: 0.5
  max_duration_sec: 30.0
  min_text_len: 2
  max_text_len: 500
  test_split: 0.1
  seed: 42

model:
  base_model: "openai/whisper-small"     # confirmed: whisper-medium OOMs on a single T4, small fits
  language: "arabic"
  task: "transcribe"

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]

training:
  output_dir: "speech-to-text/checkpoints"
  # Phase 1 — encoder frozen, train decoder + LoRA only
  phase1:
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 1.0e-5        # confirmed: 3e-5 caused catastrophic forgetting
    warmup_steps: 200
    max_steps: 4000
    save_steps: 500
    eval_steps: 500
    logging_steps: 50
    bf16: true
    fp16: false
  # Phase 2 — unfreeze encoder, continue at a lower LR
  phase2:
    learning_rate: 5.0e-6
    warmup_steps: 100
    max_steps: 1000
  generation_max_length: 225     # confirmed: 24 was truncating almost every sentence
  repetition_penalty: 1.1        # confirmed: 2.0 broke valid Arabic repetition
  no_repeat_ngram_size: 3
